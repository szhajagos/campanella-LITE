# Help
help.usage: "Usage: {usage}"
help.examples: "Examples:"
help.get: "Shows a value or a whole entity by its path."
help.set: "Changes a value by its path. An empty value (\"\") removes an optional value."
help.list: "Lists pages, layouts, content, menus, languages or redirects."
help.help: "Lists the commands, or describes one."
help.build: "Generates the published pages (or one page) in every language now, instead of on their first visit."
help.cache_clear: "Deletes the generated pages; they are generated again on their next visit."
help.redirect_remove: "Removes a redirect from an old address."
help.check: "Checks the whole website and lists every problem."
help.page_create: "Creates a page. The id is assigned automatically; without an alias the page is at /node/<id>."
help.page_delete: "Deletes a page. Menu items and the front page setting that point to it block this unless --force."
help.page_alias: "Sets or removes (--remove) the readable address of a page."
help.page_publish: "Publishes a page, so visitors can see it."
help.page_unpublish: "Turns a page back into a draft that only the admin can preview."
help.page_place: "Places content into a column of a page, after what the page shows there now (or at --at)."
help.page_unplace: "Removes content from a column of a page."
help.page_reset: "Makes a column of a page show the layout's default content again."
help.content_create: "Creates content with a title and an optional text."
help.content_edit: "Replaces the text of a content item in one language."
help.content_translate: "Adds or updates a language version of a content item."
help.content_delete: "Deletes content, or one language version with --lang. Places that use it block this unless --force."
help.layout_create: "Creates an empty layout, or a copy of another one with --from."
help.layout_delete: "Deletes a layout that no page uses."
help.layout_region_add: "Adds a region (a row) to a layout, at the bottom or --after/--before another region."
help.layout_region_remove: "Removes a region and its columns from a layout."
help.layout_column_add: "Adds a column (region.column) with a width of 1–12 to a region."
help.layout_column_remove: "Removes a column from a layout."
help.layout_place: "Places default content into a layout column; every page that does not override the column shows it."
help.layout_unplace: "Removes default content from a layout column."
help.menu_create: "Creates an empty menu."
help.menu_delete: "Deletes a menu. Layout columns that show it block this unless --force."
help.menu_item_add: "Adds a menu item that links to a page (--page) or a URL (--url), optionally below another item (--parent)."
help.menu_item_remove: "Removes a menu item and its children, by position (e.g. 2 or 2.1)."
help.language_add: "Enables a language for the website."
help.language_remove: "Disables a language. Existing texts in it block this unless --force, which deletes them."
help.language_default: "Makes an enabled language the default."

