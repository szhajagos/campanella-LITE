# Campanella Lite – English message catalogue.
#
# Keys are stable identifiers; {placeholders} are replaced with values.
# To translate, copy this file to messages.{locale}.yaml and translate the
# texts. Missing keys fall back to English.

# Line and batch labels
format.ok: "Ok."
format.error: "Error:"
