violation.name.reserved: "\"{name}\" is a reserved name here."
violation.site.no_languages: "The website needs at least one language."
violation.site.invalid_language: "\"{language}\" is not a valid language code (e.g. en, hu, pt-BR)."
violation.site.duplicate_language: "The language \"{language}\" is listed twice."
violation.site.unknown_default_language: "The default language \"{language}\" is not among the website's languages."
violation.site.unknown_default_layout: "The default layout \"{layout}\" does not exist."
violation.site.unknown_front_page: "The front page {page} does not exist."
violation.site.next_page_id_in_use: "The next page id {next} is already in use (highest id: {highest})."
violation.layout.duplicate_region: "The region \"{region}\" exists twice."
violation.layout.duplicate_column: "The column \"{column}\" exists twice in its region."
violation.layout.invalid_width: "A column width must be between 1 and {max}, not {width}."
violation.layout.region_too_wide: "The columns of this region are {width} wide in total; at most {max} fit."
violation.layout.content_and_menu: "A column can hold content or a menu, not both."
violation.layout.unknown_content: "The content \"{content}\" does not exist."
violation.layout.unknown_menu: "The menu \"{menu}\" does not exist."
violation.page.invalid_id: "The page id {id} is not valid."
violation.page.unknown_layout: "The layout \"{layout}\" does not exist."
violation.page.invalid_alias: "\"{alias}\" is not a valid alias. Use lowercase letters, digits and hyphens, starting with \"/\", e.g. /about or /services/web-design."
violation.page.reserved_alias: "The alias \"{alias}\" starts with the reserved \"{segment}\"."
violation.page.duplicate_alias: "The alias \"{alias}\" is already used by page {page}."
violation.page.unknown_column: "The layout \"{layout}\" has no column \"{column}\"."
violation.page.unknown_content: "The content \"{content}\" does not exist."
violation.content.no_translations: "The content has no language version."
violation.content.missing_title: "The title is empty."
violation.menu.invalid_target: "A menu item needs exactly one target: a page or a URL."
violation.menu.unknown_page: "The page {page} does not exist."
violation.menu.invalid_url: "\"{url}\" is not an allowed link. Use http(s)://, mailto: or a path starting with \"/\"."
violation.text.unknown_language: "\"{language}\" is not among the website's languages."
violation.text.missing_default_language: "A text in the default language ({language}) is required."
