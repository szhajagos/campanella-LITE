# Builds the installable package when a version tag is pushed:
#
#     git tag -a v0.1.0 -m "Campanella Lite 0.1.0"
#     git push origin v0.1.0
#
# The package is the repository (without the files marked export-ignore in
# .gitattributes) plus the production dependencies in app/vendor/, so it
# runs without Composer. It is published as a GitHub release with the
# notes of that version from CHANGELOG.md.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, zip
          coverage: none
          tools: composer:v2

      - name: Check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code_version=$(php -r 'require "app/src/Application.php"; echo Campanella\Lite\Application::VERSION;')
          if [ "$version" != "$code_version" ]; then
            echo "::error::The tag says $version, Application::VERSION says $code_version."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test before packaging
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi
          composer analyse -- --no-progress
          composer test

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="campanella-lite-$VERSION"
          mkdir -p build
          # Use the lock file of the tested build, so the package has exactly the tested versions.
          git archive --format=tar --prefix="$name/" HEAD | tar -x -C build
          cp composer.lock "build/$name/composer.lock"
          (cd "build/$name" && composer install --no-dev --prefer-dist --optimize-autoloader --classmap-authoritative --no-progress --no-interaction)
          (cd build && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          ls -l build

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > build/notes.md
          cat build/notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Campanella Lite ${{ steps.version.outputs.version }}
          body_path: build/notes.md
          files: |
            build/campanella-lite-${{ steps.version.outputs.version }}.zip
            build/campanella-lite-${{ steps.version.outputs.version }}.zip.sha256
